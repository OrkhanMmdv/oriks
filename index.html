<!doctype html>
<html lang="az" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pəhləvan</title>
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<script>
  // Cache-busting: Telegram keeps old copies of the app's files. Every module and the stylesheet
  // get a version that changes every 10 minutes (GitHub Pages' own cache time), via an import map,
  // so an update reaches the phone at most ~10 minutes after it's pushed.
  (function () {
    var V = String(Math.floor(Date.now() / 600000));
    var mods = ['main', 'api', 'ui', 'store', 'program', 'screens/today', 'screens/train', 'screens/workout', 'screens/food', 'screens/progress', 'screens/more'];
    var map = { imports: {} };
    mods.forEach(function (m) { map.imports[new URL('js/' + m + '.js', location.href).href] = new URL('js/' + m + '.js?v=' + V, location.href).href; });
    var im = document.createElement('script'); im.type = 'importmap'; im.textContent = JSON.stringify(map);
    document.currentScript.after(im);
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'css/app.css?v=' + V;
    document.head.appendChild(css);
    window.__V = V;
  })();
</script>
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav id="tabs" class="tabs" hidden aria-label="Bölmələr">
  <button data-tab="today"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.5 3 4.5 5 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.3 1.3-3.8 2.4-4.8.1 1.5.8 2.6 1.8 3-.4-2.4-.2-5.3.3-7.7z"/></svg><span>Bu gün</span></button>
  <button data-tab="train"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg><span>Məşq</span></button>
  <button data-tab="food"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg><span>Yemək</span></button>
  <button data-tab="progress"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19h16M7 15l4-5 3 3 5-7"/></svg><span>Nəticə</span></button>
  <button data-tab="more"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg><span>Qalanı</span></button>
</nav>
<script type="module">import "./js/main.js";</script>
</body>
</html>
