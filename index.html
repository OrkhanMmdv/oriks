<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Oriks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f8;
    --card: #ffffff;
    --text: #14161b;
    --hint: #868b96;
    --line: rgba(120,125,140,.16);
    --soft: rgba(120,125,140,.09);
    --shadow: 0 1px 2px rgba(20,22,40,.04), 0 6px 20px rgba(20,22,40,.06);
    --accent: #5b5bf0;
    --accent-text: #fff;
    --green: #22b26b;
    --green-soft: rgba(34,178,107,.22);
    --red: #ef4b55;
    --work: #3b82f6;  --work2: #06b6d4;
    --gym: #f97316;   --gym2: #f43f5e;
    --study: #8b5cf6; --study2: #6366f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13; --card: #1a1c22; --text: #f1f2f5; --hint: #8e93a0;
      --line: rgba(255,255,255,.08); --soft: rgba(255,255,255,.06);
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 16px 48px; }
  h1 { font-size: 26px; margin: 2px 0 0; letter-spacing: -.02em; }
  h2 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--hint); margin: 24px 4px 10px; font-weight: 700; }
  .hint { color: var(--hint); font-size: 13px; }
  .center { text-align: center; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .btn { background: linear-gradient(135deg, var(--c1, var(--accent)), var(--c2, #8b5cf6)); color: #fff; border-radius: 14px; padding: 13px 16px; font-weight: 600; width: 100%;
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--c1, var(--accent)) 70%, transparent); transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--soft); color: var(--text); box-shadow: none; }
  .btn.ok { --c1: #22b26b; --c2: #10b981; }
  .btn.sm { width: auto; padding: 8px 14px; font-size: 14px; }
  .icon { width: 38px; height: 38px; border-radius: 12px; display: inline-grid; place-items: center; font-size: 18px; background: var(--card); box-shadow: var(--shadow); }
  .icon:active, .sec:active { opacity: .75; }
  input, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--soft); border: 1.5px solid transparent;
    border-radius: 14px; padding: 12px 14px; width: 100%; outline: none; transition: border-color .15s; }
  input:focus, textarea:focus { border-color: var(--c1, var(--accent)); background: transparent; }
  textarea { resize: vertical; min-height: 90px; }

  /* section themes */
  .t-work  { --c1: var(--work);  --c2: var(--work2); }
  .t-gym   { --c1: var(--gym);   --c2: var(--gym2); }
  .t-study { --c1: var(--study); --c2: var(--study2); }

  /* banner header inside sections */
  .banner { position: relative; overflow: hidden; border-radius: 24px; padding: 14px 16px 18px; margin-bottom: 14px; color: #fff;
    background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 10px 28px -12px var(--c1); }
  .banner::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .banner .icon { background: rgba(255,255,255,.2); box-shadow: none; color: #fff; }
  .banner h2 { margin-top: 12px; font-size: 24px; }
  .banner .sub { opacity: .85; font-size: 14px; }
  .back { font-size: 26px; line-height: 1; }

  /* home hero */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 18px; margin-bottom: 18px; color: #fff;
    background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #db2777); box-shadow: 0 14px 34px -14px #6d28d9; }
  .hero::before { content: ""; position: absolute; right: -60px; top: -70px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.1); }
  .hero .top { margin: 0 0 16px; }
  .hero .hint { color: rgba(255,255,255,.8); }
  .hero .icon { background: rgba(255,255,255,.18); box-shadow: none; }
  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: relative; }
  .ring { background: rgba(255,255,255,.14); border-radius: 18px; padding: 10px 6px 8px; text-align: center; cursor: pointer; }
  .ring svg { display: block; margin: 0 auto 4px; }
  .ring b { font-size: 13px; display: block; }
  .ring span { font-size: 11px; opacity: .8; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* home sections */
  .sec { display: flex; align-items: center; gap: 14px; cursor: pointer; padding: 16px; }
  .sec-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 25px; flex: none;
    background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 6px 14px -6px var(--c1); }
  .sec b { font-size: 17px; }
  .chev { color: var(--hint); font-size: 24px; }

  .bar { height: 8px; border-radius: 6px; background: var(--soft); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--c1, var(--accent)), var(--c2, var(--accent))); transition: width .4s; }
  .bar.over > i { background: var(--red); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 18px; padding: 14px 8px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 22px; letter-spacing: -.02em; }
  .stat span { font-size: 12px; color: var(--hint); }

  /* calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .icon { box-shadow: none; background: var(--soft); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .wd { text-align: center; font-size: 11px; color: var(--hint); padding-bottom: 2px; font-weight: 600; }
  .day { aspect-ratio: 1; border-radius: 12px; background: var(--soft); font-size: 14px; position: relative; font-weight: 500; }
  .day:disabled { opacity: .3; cursor: default; }
  .day.today { box-shadow: inset 0 0 0 2px var(--c1, var(--accent)); font-weight: 700; }
  .day.on { background: linear-gradient(135deg, #22b26b, #10b981); color: #fff; font-weight: 700; }
  .day.part { background: var(--green-soft); }
  .day.sel { outline: 2px solid var(--study); outline-offset: 1px; }
  .day.dot::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--study); }
  .day.on.dot::after { background: #fff; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--hint); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* tabs */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-radius: 16px; padding: 5px; gap: 4px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .tabs button { padding: 8px 2px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--hint); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button em { font-style: normal; font-size: 18px; }
  .tabs button.act { background: linear-gradient(135deg, var(--gym), var(--gym2)); color: #fff; }

  /* lists */
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .x { color: var(--hint); font-size: 18px; width: 30px; height: 30px; border-radius: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--soft); border-radius: 20px; padding: 7px 12px; font-size: 13px; font-weight: 500; }
  .check { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 15px; color: #fff; transition: all .15s; }
  .check.on { background: linear-gradient(135deg, #22b26b, #10b981); border-color: transparent; }
  .task { cursor: pointer; }
  .task.done .grow { text-decoration: line-through; color: var(--hint); }
  .badge { font-size: 10px; font-weight: 800; letter-spacing: .03em; color: var(--study); background: color-mix(in srgb, var(--study) 14%, transparent); border-radius: 6px; padding: 2px 6px; margin-left: 6px; text-decoration: none; display: inline-block; }
  .big { font-size: 36px; font-weight: 800; letter-spacing: -.03em; }
  .pos { color: var(--red); } .neg { color: var(--green); }

  /* workout */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .week div { text-align: center; padding: 8px 0 6px; border-radius: 12px; background: var(--soft); font-size: 12px; font-weight: 600; color: var(--hint); }
  .week div small { display: block; font-size: 14px; margin-top: 2px; }
  .week div.train { color: var(--text); }
  .week div.on { background: linear-gradient(135deg, #22b26b, #10b981); color: #fff; }
  .week div.now { box-shadow: inset 0 0 0 2px var(--gym); }
  .ex { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: ex; }
  .ex li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); counter-increment: ex; }
  .ex li:last-child { border-bottom: 0; }
  .ex li::before { content: counter(ex); width: 24px; height: 24px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700;
    color: var(--gym); background: color-mix(in srgb, var(--gym) 14%, transparent); }
  .ex li span { margin-left: auto; color: var(--hint); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: color-mix(in srgb, var(--gym) 14%, transparent); color: var(--gym); }
  .tips { margin: 0; padding-left: 18px; color: var(--hint); font-size: 13px; }
  .tips li { margin: 4px 0; }

  /* photos */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ph { position: relative; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden; background: var(--soft); padding: 0; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #fff; padding: 16px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.65)); text-align: left; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 10; gap: 12px; }
  .overlay img { max-width: 100%; max-height: 75vh; border-radius: 14px; }
  .file { position: relative; overflow: hidden; display: block; text-align: center; }
  .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  /* login */
  body.locked { background: linear-gradient(160deg, #4f46e5, #7c3aed 55%, #db2777); min-height: 100vh; }
  .login { min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: #fff; }
  .login .hint { color: rgba(255,255,255,.75); }
  .lock-ic { width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; font-size: 34px; background: rgba(255,255,255,.18); }
  .dots { display: flex; gap: 16px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); transition: all .15s; }
  .dots i.f { background: #fff; border-color: #fff; transform: scale(1.1); }
  .pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 16px; }
  .pad button { height: 74px; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 28px; font-weight: 500; }
  .pad button:active { background: rgba(255,255,255,.32); }
  .glass { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.25); }
  .glass::placeholder { color: rgba(255,255,255,.7); }
  .glass:focus { border-color: #fff; background: rgba(255,255,255,.22); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(20,20,28,.92); color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14px; z-index: 20; font-weight: 500; }
  svg text { fill: var(--hint); font-size: 10px; }

  /* ================= v3: motion & polish ================= */
  :root { --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); }
  body { background:
      radial-gradient(900px 500px at 110% -10%, color-mix(in srgb, var(--study) 10%, transparent), transparent 60%),
      radial-gradient(700px 500px at -20% 10%, color-mix(in srgb, var(--work) 9%, transparent), transparent 60%),
      var(--bg);
    background-attachment: fixed; min-height: 100vh; }
  #app { padding-bottom: 120px; }
  body.locked #app { padding-bottom: 40px; }
  .card { border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
  .sec { transition: transform .2s var(--ease); }
  .sec:active { transform: scale(.97); opacity: 1; }
  .sec-ic { transition: transform .4s var(--spring); }
  .sec:hover .sec-ic { transform: rotate(-8deg) scale(1.06); }
  .chev { transition: transform .25s var(--ease); }
  .sec:hover .chev { transform: translateX(4px); }
  .btn { position: relative; overflow: hidden; transition: transform .15s var(--ease), filter .2s; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.96); }
  .btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    transform: translateX(-120%); pointer-events: none; }
  .btn.ok:not(.ghost)::after, .shine::after { animation: shine 3.2s 1s infinite; }
  @keyframes shine { 0% { transform: translateX(-120%); } 30%, 100% { transform: translateX(120%); } }
  .chip, .day, .tabs button, .icon, .check, .x { transition: transform .15s var(--ease), background .2s, color .2s; }
  .chip:active, .day:active:not(:disabled), .icon:active, .x:active { transform: scale(.88); }
  .chip:hover { background: color-mix(in srgb, var(--c1, var(--accent)) 16%, transparent); }

  /* page enter: whole page slides in, children stagger */
  .anim .page { animation: pageIn .45s var(--ease) both; }
  .anim .st { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms + 40ms); }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  .anim .bar > i { animation: grow 1s var(--ease) both .25s; transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } }
  .anim .rp { animation: ringFill 1.3s var(--ease) both .2s; }
  @keyframes ringFill { from { stroke-dashoffset: var(--c); } }
  .anim .day { animation: dayIn .4s var(--spring) both; animation-delay: calc(var(--d, 0) * 9ms + 150ms); }
  @keyframes dayIn { from { opacity: 0; transform: scale(.6); } }
  .anim .ex li { animation: slideIn .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms + 200ms); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } }

  /* tap feedback */
  .pop { animation: pop .5s var(--spring); }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .check.on { animation: none; }
  .pop .check.on, .check.on.pop { animation: checkPop .45s var(--spring); }
  @keyframes checkPop { 0% { transform: scale(.4) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
  .day.on.pop { box-shadow: 0 0 0 0 rgba(34,178,107,.6); animation: pop .5s var(--spring), pulse .9s var(--ease); }
  @keyframes pulse { to { box-shadow: 0 0 0 14px rgba(34,178,107,0); } }

  /* hero & banners: living gradients */
  .hero { background: linear-gradient(125deg, #4f46e5, #7c3aed, #db2777, #f97316, #7c3aed, #4f46e5); background-size: 400% 400%;
    animation: flow 18s ease infinite; }
  @keyframes flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .hero::after { content: ""; position: absolute; left: -50px; bottom: -80px; width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,.08); animation: float 9s ease-in-out infinite; }
  .hero::before { animation: float 11s ease-in-out infinite reverse; }
  @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(18px, -14px); } }
  .hero h1 { background: linear-gradient(90deg, #fff, #fde68a, #fff); background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: textShine 6s linear infinite; }
  @keyframes textShine { to { background-position: 200% center; } }
  .wave { color: #fff; -webkit-text-fill-color: #fff; display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(10deg); } }
  .ring { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.16); transition: transform .2s var(--ease), background .2s; }
  .ring:hover { background: rgba(255,255,255,.22); }
  .ring:active { transform: scale(.94); }
  .ring .rp { filter: drop-shadow(0 0 4px rgba(255,255,255,.6)); }

  .banner { background-size: 200% 200%; animation: flow 12s ease infinite; }
  .banner .deco { position: absolute; right: 18px; top: 50%; font-size: 64px; opacity: .9; transform: translateY(-50%) rotate(-10deg);
    animation: bob 4s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(0,0,0,.2)); pointer-events: none; }
  @keyframes bob { 0%, 100% { transform: translateY(-50%) rotate(-10deg); } 50% { transform: translateY(-58%) rotate(-4deg); } }
  .banner h2, .banner .sub, .banner .icon { position: relative; z-index: 1; }
  .banner h2, .banner .sub { padding-right: 84px; }

  /* sticky glass bottom nav */
  #nav { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
    width: min(420px, calc(100% - 32px)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 24px;
    background: color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid var(--line); box-shadow: 0 12px 36px -10px rgba(20,22,40,.35); transition: transform .45s var(--spring), opacity .3s; }
  #nav.hide { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
  #nav .ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 18px;
    background: linear-gradient(135deg, var(--n1), var(--n2)); box-shadow: 0 6px 16px -6px var(--n1);
    transition: transform .5s var(--spring), background .4s; }
  #nav button { position: relative; z-index: 1; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px;
    font-size: 11px; font-weight: 600; color: var(--hint); transition: color .3s; }
  #nav button em { font-style: normal; font-size: 20px; transition: transform .4s var(--spring); }
  #nav button.act { color: #fff; }
  #nav button.act em { transform: translateY(-2px) scale(1.12); }

  /* login: animated blobs */
  html.locked { background: #4c1d95; }
  body.locked { background: transparent; overflow-x: hidden; }
  body.locked::before, body.locked::after { content: ""; position: fixed; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(60px); opacity: .75; z-index: -1; }
  body.locked::before { background: radial-gradient(circle, #6366f1, transparent 65%); top: -25vmax; left: -20vmax; animation: blob1 14s ease-in-out infinite; }
  body.locked::after { background: radial-gradient(circle, #ec4899, transparent 65%); bottom: -25vmax; right: -20vmax; animation: blob2 16s ease-in-out infinite; }
  @keyframes blob1 { 50% { transform: translate(15vmax, 20vmax) scale(1.15); } }
  @keyframes blob2 { 50% { transform: translate(-15vmax, -18vmax) scale(1.1); } }
  .login > * { animation: rise .6s var(--ease) both; }
  .login > *:nth-child(2) { animation-delay: .08s; } .login > *:nth-child(3) { animation-delay: .16s; } .login > *:nth-child(4) { animation-delay: .24s; }
  .login.still > * { animation: none; }
  .lock-ic { animation: bob2 3.5s ease-in-out infinite; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.25); }
  @keyframes bob2 { 50% { transform: translateY(-8px); } }

// Fetch every row of a table (Supabase returns at most 1000 per request).
async function all(table) {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select('*').range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) return rows;

}

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 1100 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);

    };
    img.onerror = rej; img.src = url;
  });
}

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight chart">
    <line x1="${L}" x2="${W - R}" y1="${y(max - .5)}" y2="${y(max - .5)}" stroke="var(--line)"/>

// Animate the leading number of an element from 0 to its value.
function countUp(el) {
  const node = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
  const m = node && node.textContent.match(/^(\s*[+-]?)(\d+(?:\.\d+)?)/);
  if (!m) return;
  const target = +m[2], dec = (m[2].split('.')[1] || '').length, rest = node.textContent.slice(m[0].length), t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    node.textContent = m[1] + (target * e).toFixed(dec) + rest;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Celebration: confetti + big emoji.
function confetti(emoji = '🎉') {
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#6366f1', '#a855f7', '#ec4899', '#f97316', '#facc15', '#22c55e', '#06b6d4'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
    c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
    c.style.setProperty('--t', (1.4 + Math.random() * 1.3) + 's');
    c.style.animationDelay = Math.random() * .25 + 's';
    if (i % 3 === 0) c.style.borderRadius = '50%';
    box.appendChild(c);
  }
  const big = document.createElement('div'); big.className = 'celebrate'; big.textContent = emoji;
  document.body.append(box, big);
  setTimeout(() => { box.remove(); big.remove(); }, 3000);
}

      if (S.pin === PASSWORD) {
        haptic('ok'); render(); document.body.classList.add('unlocking');
        setTimeout(() => { document.body.classList.remove('unlocking'); S.unlocked = true; S.pin = ''; S.loginShown = false; S.anim = true; render(); }, 380); return;
      }
      render(); haptic('error');
      const dots = document.getElementById('dots'); dots.classList.add('shake');
      setTimeout(() => { S.pin = ''; render(); }, 400); return;
    }
    render();
  },
  async signIn() {
    const email = document.getElementById('em').value.trim(), password = document.getElementById('pw').value;
    if (!email || !password) return toast('Enter email and password');
    S.busy = true; render();
    const { error } = await sb.auth.signInWithPassword({ email, password });
    S.busy = false;
    if (error) { haptic('error'); toast(error.message); render(); }
  },
  async signOut() {
    if (!(await ask('Sign out of your database on this device?', 'Sign out'))) return;
    await sb.auth.signOut(); localStorage.removeItem('oriks-cache'); load(); render();
  },
  lock() { S.unlocked = false; S.loginShown = false; S.view = 'home'; render(); },
  home() { S.view = 'home'; S.anim = true; render(); window.scrollTo(0, 0); },
  go(v) { S.view = v; S.anim = true; render(); window.scrollTo(0, 0); },

  toggleWork(k) {
    const on = !D.work[k]; on ? D.work[k] = 1 : delete D.work[k];
    haptic(on ? 'ok' : ''); save(); S.popSel = `[data-a="toggleWork"][data-v="${k}"]`; render(); toggleRow('work_days', k, on);
    if (on && k === today()) confetti('💼');
  },
  workNav(v) { S.workMonth = new Date(S.workMonth.getFullYear(), S.workMonth.getMonth() + +v, 1); render(); },

  gymTab(v) { S.gymTab = v; S.editDay = null; S.anim = true; render(); },
  saveWeight() {
    const kg = parseFloat(document.getElementById('kg').value.replace(',', '.'));
    if (!(kg > 20 && kg < 400)) return toast('Enter a valid weight');
    const t = today(), v = +kg.toFixed(1);
    D.weight = D.weight.filter(x => x.d !== t).concat({ d: t, kg: v }).sort((a, b) => a.d < b.d ? -1 : 1);
    save(); haptic('ok'); toast('Saved ✓'); S.anim = true; render();
    db(sb.from('weights').upsert({ user_id: uid(), day: t, kg: v }));
  },
  async delWeight(d) {
    if (!(await ask('Delete this entry?'))) return;
    D.weight = D.weight.filter(x => x.d !== d); save(); render();
    db(sb.from('weights').delete().eq('day', d));
  },
  addFood() {
    const n = document.getElementById('fname').value.trim(), k = parseInt(document.getElementById('fkcal').value, 10);
    if (!n || !(k > 0)) return toast('Enter food name and kcal');
    A._food(n, k); haptic('ok');
  },
  quickFood(v) { const f = JSON.parse(v); A._food(f.n, f.k); haptic(); toast(`+${f.k} kcal 🍽`); },
  async _food(n, k) {
    const t = today(), item = { n, k };
    (D.food[t] = D.food[t] || []).push(item); save(); render();
    const row = await db(sb.from('meals').insert({ day: t, name: n, kcal: k }).select('id').single());
    if (row) { item.id = row.id; save(); }
  },
  delFood(i) {
    const [item] = D.food[today()].splice(+i, 1); save(); render();
    if (item && item.id) db(sb.from('meals').delete().eq('id', item.id));
  },
  toggleGym() {
    const t = today(), on = !D.gymDone[t]; on ? D.gymDone[t] = 1 : delete D.gymDone[t];
    haptic(on ? 'ok' : ''); save(); S.popSel = '[data-a="toggleGym"]'; render(); toggleRow('workouts', t, on);
    if (on) confetti('💪');
  },
  editDay(v) { S.editDay = v === '' ? null : +v; render(); },
  savePlan(i) {
    D.plan[+i] = { n: document.getElementById('pn').value.trim() || 'Workout', ex: document.getElementById('pe').value.trim() };
    S.editDay = null; save(); toast('Plan saved ✓'); render(); saveSettings();
  },
  viewPhoto(id) { S.photoView = +id; render(); },
  closePhoto(v, el, e) { if (e.target.tagName === 'IMG') return; S.photoView = null; render(); },
  async delPhoto(id) {
    if (!(await ask('Delete this photo?'))) return;
    const p = S.photos.find(x => x.id === +id); if (!p) return;
    await sb.storage.from('photos').remove([p.path]);
    await db(sb.from('photos').delete().eq('id', p.id));
    S.photos = S.photos.filter(x => x !== p); S.photoView = null; render();
  },

  studyDay(k) { S.studySel = k; S.editPlan = false; render(); },
  studyNav(v) { S.studyMonth = new Date(S.studyMonth.getFullYear(), S.studyMonth.getMonth() + +v, 1); render(); },
  toggleTask(id, el) {
    const k = S.studySel, d = D.study[k] = studyDay(k); d.done = d.done || {};
    const wasBelow = studyMin(k) < D.studyGoal, on = !d.done[id], m = +el.dataset.m;
    on ? d.done[id] = m : delete d.done[id];
    const reached = wasBelow && studyMin(k) >= D.studyGoal;
    haptic(reached ? 'ok' : '');
    save(); S.popSel = `[data-a="toggleTask"][data-v="${CSS.escape(id)}"]`; render();
    if (reached) confetti('🔥');
    db(on ? sb.from('study_tasks').upsert({ user_id: uid(), day: k, task: id, minutes: m })
          : sb.from('study_tasks').delete().eq('day', k).eq('task', id));
  },
  extra(v) {
    const k = S.studySel, d = D.study[k] = studyDay(k); d.extra = Math.max(0, (d.extra || 0) + +v);
    save(); render(); saveStudyDay(k);
  },
  editPlan() { S.editPlan = !S.editPlan; render(); },
  saveStudyPlan() {
    const lines = document.getElementById('planTxt').value.split('\n').map(l => l.trim()).filter(Boolean);
    D.studyPlan = lines.map(l => { const m = l.match(/^(\d+)\s*(?:min)?\s*[-–:]?\s*(.+)$/i); return m ? { m: +m[1], t: m[2] } : { m: 30, t: l }; });
    D.dbMin = Math.max(5, +document.getElementById('dbMin').value || 45);
    D.studyGoal = Math.max(10, +document.getElementById('goalMin').value || 90);
    S.editPlan = false; save(); toast('Plan saved ✓'); render(); saveSettings();
  },
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'LABEL') return;
  A[el.dataset.a] && A[el.dataset.a](el.dataset.v, el, e);
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.c === 'calGoal') { const v = parseInt(el.value, 10); if (v > 0) { D.calGoal = v; save(); render(); saveSettings(); } }
  if (el.dataset.c === 'photo' && el.files[0]) {
    toast('Uploading photo…');
    try { await uploadPhoto(await compress(el.files[0]), today()); await loadPhotos(); haptic('ok'); render(); }
    catch (err) { console.error(err); toast('Could not upload the photo'); }
  }
});
app.addEventListener('input', e => {
  if (e.target.dataset.i === 'note') {
    const k = S.studySel; D.study[k] = studyDay(k); D.study[k].note = e.target.value; save();
    clearTimeout(noteTimer); noteTimer = setTimeout(() => saveStudyDay(k), 800);
  }
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'kg') A.saveWeight();
  if (e.target.id === 'fkcal' || e.target.id === 'fname') A.addFood();
  if (e.target.id === 'pw' || e.target.id === 'em') A.signIn();
});
document.addEventListener('keydown', e => {   // allow typing the PIN on a keyboard (desktop)
  if (S.unlocked) return;
  if (/^\d$/.test(e.key)) A.pin(e.key); else if (e.key === 'Backspace') A.pin('del');
});

/* ---------- start ---------- */
load();
render();
let fetched = false;
sb.auth.onAuthStateChange((event, session) => {
  S.session = session;
  if (session && !fetched) { fetched = true; setTimeout(fetchAll, 0); }   // don't await Supabase inside this callback
  if (!session) fetched = false;
  render();
});
</script>

</body>
</html>
